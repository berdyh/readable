# Pin the Compose project name. Without it Compose derives the name from the
# directory, and this repo is checked out as a bare-repo container whose
# worktrees are named `main`, `dev`, and so on. Any other project on the machine
# whose directory is also called `main` then shares the project namespace, and
# its `docker compose up` recreates or stops these containers — which showed up
# here as Postgres repeatedly dying mid-test with ECONNREFUSED, and as another
# project's container already holding port 3000.
name: readable

# No `restart:` policy here on purpose. This is the local dev stack, and
# `restart: unless-stopped` means "come back whenever dockerd starts, unless the
# user explicitly stopped me" — so a stack left running at shutdown silently
# reappears at next boot, holding RAM and port 5432 for a test nobody is running.
# Docker has no idle timeout to counter it. Without a policy these come up only
# when you run `docker compose up`, and `docker compose down` really ends them.
#
# In production this must be set back to `restart: unless-stopped` (or `always`)
# on every service — surviving a host reboot unattended is the whole point there.

services:
  postgres:
    image: postgres:16-alpine
    container_name: readable-postgres
    environment:
      POSTGRES_USER: readable
      POSTGRES_PASSWORD: readable
      POSTGRES_DB: readable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readable -d readable"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: readable-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
