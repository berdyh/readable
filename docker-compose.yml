services:
  postgres:
    image: postgres:16-alpine
    container_name: readable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: readable
      POSTGRES_PASSWORD: readable
      POSTGRES_DB: readable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readable -d readable"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: readable-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
