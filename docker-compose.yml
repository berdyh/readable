# Pin the Compose project name. Without it Compose derives the name from the
# directory, and this repo is checked out as a bare-repo container whose
# worktrees are named `main`, `dev`, and so on. Any other project on the machine
# whose directory is also called `main` then shares the project namespace, and
# its `docker compose up` recreates or stops these containers — which showed up
# here as Postgres repeatedly dying mid-test with ECONNREFUSED, and as another
# project's container already holding port 3000.
name: readable

services:
  postgres:
    image: postgres:16-alpine
    container_name: readable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: readable
      POSTGRES_PASSWORD: readable
      POSTGRES_DB: readable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readable -d readable"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: readable-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
